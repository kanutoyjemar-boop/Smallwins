version: "3.8"

# Local dev environment for SelfUp.
#
# Option A — just the database (recommended for active development, since
# `npm run dev` restarts instantly on file changes):
#   docker compose up -d db
#   npm install
#   cp .env.example .env        # DATABASE_URL already matches this compose file
#   npm run dev                 # http://localhost:3000
#
# Option B — everything in Docker (no Node install needed on your machine):
#   docker compose --profile full up --build
#   (app will be at http://localhost:3000; rebuild with --build after code changes)

services:
  db:
    image: postgres:16-alpine
    container_name: selfup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: selfup
    ports:
      - "5432:5432"
    volumes:
      - selfup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build: .
    container_name: selfup-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/selfup
      JWT_SECRET: dev-secret-change-me
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  selfup-db-data:
