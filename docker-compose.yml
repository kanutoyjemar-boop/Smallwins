version: "3.8"

# Local dev environment for SelfUp.
#
# Option A — database plus local app (recommended for offline personal use):
#   docker compose --profile full up -d --build
#   (open http://localhost:3000; data persists in the selfup-db-data volume)
#
# Option B — just the database for active development:
#   docker compose up -d db
#   npm install
#   cp .env.example .env        # DATABASE_URL already matches this compose file
#   npm run dev                 # http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: selfup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: selfup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - selfup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    image: selfup-local:latest
    build: .
    container_name: selfup-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/selfup
      # The image runs with NODE_ENV=production; this local database has no TLS.
      DATABASE_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-before-sharing}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "npm run migrate && exec npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  selfup-db-data:
